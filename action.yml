# Zero-X GitHub Action - Run security scans in CI and publish results to Zero-X
# https://github.com/marketplace (publish from Releases)
name: 'Zero-X Security Scanner'
description: 'Perform code security scans using zero-x security platform and publish findings to GitHub Code Scanning'
author: 'Zero-X'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  zerox-api-key:
    description: 'Platform API key from Zero-X Cloud (Settings → API Keys)'
    required: true
  zerox-url:
    description: 'Zero-X platform base URL'
    default: 'https://in.zero-x.cloud'
    required: true
  scanners:
    description: 'Comma-separated list: vulns, iac, sast, malware, sbom (default all)'
    required: false
    default: 'vulns,iac,sast,malware,sbom'
  provider-type:
    description: 'Zero-X datasource provider type (default: github)'
    required: false
    default: 'github'
  branch-name:
    description: 'Branch name (default: github.ref_name)'
    required: false
    default: 'main'
  commit-sha:
    description: 'Commit SHA for Code Scanning upload (default: github.sha)'
    required: false
  run-url:
    description: 'URL to the workflow run (optional)'
    required: false
  repo-name:
    description: 'Repository name / full name used for Zero-X pre-check (default: github.repository)'
    required: false
  repo-owner:
    description: 'Repository owner (default: github.repository_owner)'
    required: false
  repo-url:
    description: 'Repository URL (default: github.repository_url)'
    required: false
  upload-to-github:
    description: 'Upload findings as SARIF to GitHub Code Scanning (Security tab)'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token with security-events: write (default: GITHUB_TOKEN)'
    required: false

outputs:
  scanResultUrl:
    description: 'A link to the scan results in Zero-X Cloud.'
  outcome:
    description: 'Scan outcome (e.g. success, failure).'
  sarifPath:
    description: 'Path to the generated SARIF file uploaded to GitHub Code Scanning.'

runs:
  using: 'node20'
  main: 'dist/index.js'
